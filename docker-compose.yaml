services:
  # Local production environment; retain the original service and volume for existing data.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nest
      POSTGRES_PASSWORD: nest
      POSTGRES_DB: nest
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nest -d nest']
      interval: 2s
      timeout: 5s
      retries: 15

  postgres-stage:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nest
      POSTGRES_PASSWORD: nest
      POSTGRES_DB: nest_stage
    ports:
      - '127.0.0.1:${STAGE_POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_stage_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nest -d nest_stage']
      interval: 2s
      timeout: 5s
      retries: 15

  stage-refresh:
    image: postgres:17-alpine
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cp /scripts/cron /etc/crontabs/root
        chmod 600 /etc/crontabs/root
        sh /scripts/refresh-stage.sh --scheduled &
        exec crond -f -l 8 -L /dev/stdout
    restart: unless-stopped
    environment:
      PGPASSWORD: nest
      PGCONNECT_TIMEOUT: '10'
      TZ: UTC
    healthcheck:
      test: ['CMD', 'sh', '/scripts/health.sh']
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 35m
    depends_on:
      postgres:
        condition: service_healthy
      postgres-stage:
        condition: service_healthy
    volumes:
      - ./docker/refresh:/scripts:ro
      - stage_refresh_work:/refresh

volumes:
  postgres_data:
  postgres_stage_data:
  stage_refresh_work:
